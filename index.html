<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>TiltBall</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1f1a45; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #unity-container {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: #2e2a5a; box-shadow: 0 0 60px rgba(0, 0, 0, 0.45);
    }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #2e2a5a; touch-action: none; }
    #unity-loading-bar {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 70%; max-width: 320px; text-align: center; color: #fff3d6; display: none;
    }
    #unity-loading-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-bottom: 18px; }
    #unity-progress-bar-empty { width: 100%; height: 10px; border-radius: 5px; background: rgba(255, 255, 255, 0.18); overflow: hidden; }
    #unity-progress-bar-full { width: 0%; height: 100%; border-radius: 5px; background: #f07d2a; transition: width 0.1s; }
    #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); padding: 8px 14px; border-radius: 6px; background: #e8383f; color: #fff; font-size: 14px; display: none; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-loading-title">TiltBall</div>
      <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    // A portrait phone game: on a phone the canvas is the whole screen, on a
    // desktop it's a phone-shaped column (no wider than 9:16) the full height
    // of the window, centred. The game's own camera fit handles either.
    var maxAspect = 9 / 16;
    function fit() {
      var w = window.innerWidth, h = window.innerHeight;
      var cw = Math.min(w, Math.floor(h * maxAspect));
      container.style.width = cw + "px";
      container.style.height = h + "px";
    }
    window.addEventListener("resize", fit);
    fit();

    function unityShowBanner(msg, type) {
      warningBanner.innerHTML = msg;
      warningBanner.style.display = "block";
      if (type !== "error") setTimeout(function () { warningBanner.style.display = "none"; }, 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "PhoenixES",
      productName: "TiltBall",
      productVersion: "1.0",
      showBanner: unityShowBanner,
    };

    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
      }).catch(function (message) {
        unityShowBanner(message, "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
